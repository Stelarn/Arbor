<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Developer Knowledge Workbench</title>
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/components.css">
  <link rel="stylesheet" href="styles/views.css">
</head>
<body>

  <!-- Top App Navigation Shell -->
  <header class="app-header">
    <div class="header-left">
      <button class="brand-btn" onclick="window.Router.navigate('home')">
        <span>⚡</span>
        <span>Developer Hub</span>
      </button>
      <div id="breadcrumbs" class="breadcrumbs"></div>
    </div>

    <div class="header-center">
      <span class="search-icon">🔍</span>
      <input type="text" id="headerSearchInput" class="search-input" placeholder="Search...">
    </div>

    <div class="header-right">
      <div id="viewModeGroup" class="btn-group" style="display:none;">
        <button class="btn view-btn active" data-view="tiles">
          <span>🗂️</span><span>Tiles</span>
        </button>
        <button class="btn view-btn" data-view="list">
          <span>☰</span><span>List</span>
        </button>
        <button class="btn view-btn" data-view="tree">
          <span>🌳</span><span>Lineage & Evolution Tree</span>
        </button>
      </div>

      <button id="exportCsvBtn" class="btn" style="display:none;">📥 Export CSV</button>
    </div>
  </header>

  <!-- Mount Point for Homepage & Workbench Views -->
  <div id="appContent" class="app-content"></div>

  <!-- Reusable Slide-Up Inspector Drawer & Tuned Subtree -->
  <div id="masterInspectorDrawer" class="master-inspector-drawer">
    <div class="drawer-top-bar">
      <div style="display:flex; align-items:center; gap:0.75rem;">
        <h3 id="inspTitle" style="font-size:1.2rem; font-weight:800; color:var(--text-main);">Technology</h3>
        <span id="inspBadge" class="badge-lineage badge-direct">Verified</span>
        <span style="font-size:0.75rem; color:var(--text-dim);" id="inspMeta"></span>
      </div>
      <div style="display:flex; align-items:center; gap:0.5rem;">
        <button id="inspActionBtn" class="btn btn-primary" style="font-size:0.75rem;">Action</button>
        <button id="inspCloseBtn" class="btn" style="padding:0.25rem 0.5rem; font-size:0.9rem;">✕</button>
      </div>
    </div>

    <div class="drawer-content-split">
      <!-- Left: Specifications -->
      <div class="drawer-spec-pane" id="drawerSpecPane"></div>

      <!-- Right: Tuned Focused Subtree -->
      <div class="drawer-tuned-tree-pane">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.4rem;">
          <span style="font-size:0.75rem; font-weight:700; color:var(--accent); text-transform:uppercase; letter-spacing:0.04em;">
            Tuned Lineage Subtree (<span id="tunedSubtreeTitle">Node</span>)
          </span>
          <span style="font-size:0.7rem; color:var(--text-dim);">Parents above &bull; Focus in center &bull; Children below</span>
        </div>
        <div class="tuned-tree-svg-wrap">
          <svg id="tunedSubtreeSvg" width="100%" height="280"></svg>
        </div>
      </div>
    </div>
  </div>
